baseURL = "https://lorainemg.github.io/"
locale = "en-us"
title = "Loraine Monteagudo"

[taxonomies]
  skill = "skills"

[params]
  tagline = "Fullstack engineer with a machine learning background, building products end to end."
  location = "Tampa, Florida"
  cvPath = ""   # set to e.g. "files/loraine-monteagudo-cv.pdf" when the PDF exists
  [params.hero]
    name = "Loraine *Monteagudo*"
    role = "Fullstack engineer with a machine learning background."
    focus = "Interfaces, APIs, data pipelines, infrastructure"
    openTo = "Fullstack and platform roles"
    # `now` is read from the current role in content/experience/ (the one with
    # endDate: null). Set it here only to override that.
    intro = "I like owning a product all the way down. I've built a simulator that models a year of an air conditioner's energy use against real weather, a platform that dims a city's street lights on schedule, and a pipeline that watches flight prices across six regions to find the ones worth telling people about. Each of those I built myself: the pipelines that clean and reshape the data, the API, the interface, and the model in the middle. Machine learning research is where I started, and it still does real work in what I build."
  [params.social]
    github = "https://github.com/lorainemg"
    linkedin = "https://www.linkedin.com/in/lorainemg"
    email = "lorainemonteagudo@gmail.com"
  
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
[outputs]
  home = ["html"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]

[module]
  [[module.imports]]
    path = "github.com/lorainemg/hugo-theme-indigo-night"
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
