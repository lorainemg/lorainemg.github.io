{{ define "main" }}
<main class="wrap">
  <header class="pt-14 pb-8">
    <p class="font-mono text-base mb-4" style="color:var(--muted)"><a href="{{ site.Home.RelPermalink }}" style="color:var(--accent)" class="no-underline">~</a> / {{ lower .Title }}</p>
    <h1 class="font-display font-bold text-5xl tracking-tight" style="color:var(--heading)">{{ T "skills_title" }}</h1>
  </header>
  <div class="flex gap-2.5 flex-wrap pb-20">
    {{ range .Data.Terms.Alphabetical }}
    <a class="chip" href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span style="color:var(--muted)">({{ .Count }})</span></a>
    {{ end }}
  </div>
</main>
{{ end }}
