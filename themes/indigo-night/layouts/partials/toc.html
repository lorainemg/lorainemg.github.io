{{ $entries := partial "toc-entries.html" . }}
{{ if ge (len $entries) 2 }}
<nav id="toc" class="toc" aria-label="{{ T "toc_label" }}">
  <p class="toc-label">{{ T "toc_label" }}</p>
  <ul>
    {{ range $entries }}<li><a href="#{{ .id }}">{{ .label }}</a></li>
    {{ end }}
  </ul>
</nav>
{{ end }}
